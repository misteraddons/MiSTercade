name: Build MiSTercade Variant DB

on:
  workflow_dispatch:
    inputs:
      variant_key:
        description: Source variant key to publish, for example maps-v2-osd
        required: false
        type: string
  push:
    branches:
      - "maps-*"

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and publish variant database
        env:
          INPUT_VARIANT_KEY: ${{ github.event.inputs.variant_key }}
        run: |
          variant_key="$INPUT_VARIANT_KEY"
          if [ -z "$variant_key" ]; then
            variant_key="$GITHUB_REF_NAME"
          fi
          if [[ "$variant_key" == gamecontrollerdb-* ]]; then
            echo "gamecontrollerdb variant publishing is paused."
            exit 0
          fi
          python3 scripts/build_consolidated_variant_db.py \
            --variant-key "$variant_key" \
            --publish

      # Older V1 setups still list [misteraddons/mistercade_mappings], which
      # reads the db branch. Rebuild it from the same V1 commit so it cannot
      # fall behind maps-v1-osd.
      - name: Publish legacy V1 database
        if: github.ref_name == 'maps-v1-osd'
        run: |
          # The previous step left the checkout on its orphan database branch.
          git checkout --force "$GITHUB_SHA"
          git clean -fdxq
          python3 scripts/build_consolidated_variant_db.py \
            --variant-key maps-v1-osd \
            --db-id misteraddons/mistercade_mappings \
            --db-branch db \
            --publish
